name: Probe
on:
  push:
    branches: [arena/f49a3156-anmaydef]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Write probe
        run: |
          mkdir -p _probe
          echo "probe ok $(date -u)" > _probe/hello.txt
          git lfs version
      - name: Commit
        run: |
          git config user.name "anmay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A _probe .github
          git commit -m "probe: lfs check" || echo "nothing"
          git push
